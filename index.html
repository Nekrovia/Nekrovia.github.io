<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEKROVIA — DayZ Server</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0d0c;
            color: white;
        }

        .hero {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.75)
                ),
                url("background.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;

            position: relative;
        }

        .content {
            max-width: 900px;
            padding: 30px;
        }

        .content h1 {
            font-size: clamp(60px, 12vw, 150px);
            letter-spacing: 12px;
            text-shadow: 0 5px 30px black;
        }

        .content p {
            margin-top: 15px;
            font-size: 20px;
            color: #d0d0d0;
            letter-spacing: 3px;
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button {
            padding: 15px 30px;
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .button:hover {
            background: white;
            color: black;
            transform: translateY(-3px);
        }

        .info {
            background: #0b0d0c;
            padding: 100px 20px;
            text-align: center;
        }

        .info h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .info p {
            max-width: 700px;
            margin: auto;
            color: #aaa;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="content">

            <h1>NEKROVIA</h1>

            <p>DAYZ SURVIVAL • PVP / PVE</p>

            <div class="buttons">

                <a href="#server" class="button">
                    SERVER
                </a>

                <a href="#" class="button">
                    DISCORD
                </a>

            </div>

        </div>

    </section>


    <section class="info" id="server">

        <h2>WELCOME TO NEKROVIA</h2>

        <p>
            Witaj w Nekrovii — świecie, w którym przetrwanie
            nie jest oczywistością. Zbieraj wyposażenie, naprawiaj
            pojazdy, buduj swoją bazę i walcz o przetrwanie.
        </p>

    </section>

</body>
</html>
